<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equilibrium #3429</title>
    <meta
      name="description"
      content="Equilibrium NFT card showcasing the collection details, pricing, and creator."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card" aria-label="Equilibrium NFT card">
      <div class="card__images" aria-label="NFT artwork preview">
        <img
          src="assets/image-equilibrium.jpg"
          alt="Equilibrium crystal cube artwork"
          class="card__image"
        />
        <div class="card__images-layer" aria-hidden="true">
          <img src="assets/icon-view.svg" alt="" class="card__images-eye" />
        </div>
      </div>

      <div id="info" class="card__info">
        <div class="card__title">
          <h1>Equilibrium #3429</h1>
        </div>

        <p class="card__description">
          Our Equilibrium collection promotes balance and calm.
        </p>
      </div>

      <div class="card__time" aria-label="NFT pricing and time remaining">
        <div class="card__time-left">
          <img src="assets/icon-ethereum.svg" alt="Ethereum" class="card__token-icon" />
          <span>0.041 ETH</span>
        </div>
        <div class="card__time-right">
          <img src="assets/icon-clock.svg" alt="Clock" class="card__clock-icon" />
          <span>3 days left</span>
        </div>
      </div>

      <div class="card__creator" aria-label="Creator information">
        <img
          src="assets/logo.jpeg"
          alt="Portrait of Ketan Makode"
        />
        <p>
          Creation of
          <a
            href="https://www.github.com/ketanmakode"
            data-url="https://github.com/ketanmakode"
            target="_blank"
            rel="noopener"
            >Ketan Makode</a
          >
        </p>
      </div>

      <footer class="card__footer">
        Challenge by
        <a href="https://www.crio.do" target="_blank" rel="noopener">Crio.Do</a>.
        Coded by
        <a
          href="https://www.github.com/ketanmakode"
          data-url="https://github.com/ketanmakode"
          target="_blank"
          rel="noopener"
          >Ketan Makode</a
        >.
      </footer>
    </main>
  </body>
</html>
